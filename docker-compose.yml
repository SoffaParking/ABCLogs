# Local or single-server deployment: the app and its Postgres.
#   docker compose up -d        then open http://localhost:8080
#   docker compose logs app     shows the setup code for the first admin
# Change POSTGRES_PASSWORD (and DATABASE_URL to match) before exposing this
# anywhere but your own machine.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apiloupe
      POSTGRES_PASSWORD: apiloupe
      POSTGRES_DB: apiloupe
    volumes:
      - db-data:/var/lib/postgresql/data
    # 5433 on the host, so it does not collide with a Postgres already
    # running on your machine. Only reachable from this machine.
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apiloupe -d apiloupe']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://apiloupe:apiloupe@db:5432/apiloupe
      PORT: '8080'
      LOG_LEVEL: info
      RETENTION_DAYS: '14'
      # The https address people use, once you put it behind a TLS proxy:
      # PUBLIC_URL: https://apiloupe.example.com
      # TRUST_PROXY: 'true'
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
