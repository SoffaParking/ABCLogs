# Local or single-server deployment: the app and its Postgres.
#   docker compose up -d        then open http://localhost:8080
# Change POSTGRES_PASSWORD (and DATABASE_URL to match) before exposing this
# anywhere but your own machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apiloupe
      POSTGRES_PASSWORD: apiloupe
      POSTGRES_DB: apiloupe
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apiloupe -d apiloupe']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://apiloupe:apiloupe@db:5432/apiloupe
      PORT: '8080'
      LOG_LEVEL: info
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
