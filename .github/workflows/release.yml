name: Release

# On a version tag: publish the Docker image (amd64 and arm64) to the GitHub
# Container Registry, and @apiloupe/node to npm when an NPM_TOKEN secret is set.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    name: Docker image to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Soffa API Logs Dashboard
            org.opencontainers.image.description=Self-hosted dashboard for your API's requests and errors
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: '@apiloupe/node to npm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apiloupe/node build
      - run: pnpm --filter @apiloupe/node check:package
      - name: Publish (skipped without an NPM_TOKEN secret)
        working-directory: packages/sdk-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret: not publishing."
            exit 0
          fi
          pnpm publish --access public --provenance --no-git-checks
