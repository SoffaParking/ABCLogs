version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image follows Node's LTS line; moving to a new major is a deliberate
    # change, not an automatic bump.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
